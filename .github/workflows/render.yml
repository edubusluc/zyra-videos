name: Generar vídeos
on:
  # Solo manual: subir cambios (guiones, src, public...) no renderiza nada.
  workflow_dispatch:
    inputs:
      ids:
        description: 'Guiones a renderizar, separados por espacios (p. ej. "mi-guion meme-x reaccion-y"). Vacío = todos.'
        required: false
        default: ''
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # La voz se pide antes de renderizar (locución única: los subtítulos siguen a la voz), así que el render también necesita las credenciales.
      VOZ_PROVEEDOR: ${{ secrets.VOZ_PROVEEDOR || vars.VOZ_PROVEEDOR }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || vars.AZURE_SPEECH_REGION }}
      AZURE_SPEECH_VOICE: ${{ secrets.AZURE_SPEECH_VOICE || vars.AZURE_SPEECH_VOICE }}
      AZURE_SPEECH_RATE: ${{ secrets.AZURE_SPEECH_RATE || vars.AZURE_SPEECH_RATE }}
      AZURE_SPEECH_PITCH: ${{ secrets.AZURE_SPEECH_PITCH || vars.AZURE_SPEECH_PITCH }}
      AZURE_SPEECH_STYLE: ${{ secrets.AZURE_SPEECH_STYLE || vars.AZURE_SPEECH_STYLE }}
      AZURE_SPEECH_STYLE_DEGREE: ${{ secrets.AZURE_SPEECH_STYLE_DEGREE || vars.AZURE_SPEECH_STYLE_DEGREE }}
      AZURE_SPEECH_PERFIL: ${{ vars.AZURE_SPEECH_PERFIL }}
      VOZ_MEZCLA: ${{ vars.VOZ_MEZCLA }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
      ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY }}
      ELEVENLABS_SIMILARITY: ${{ vars.ELEVENLABS_SIMILARITY }}
      ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE }}
      ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED }}
    steps:
      - uses: actions/checkout@v4
      - name: Qué hay que renderizar
        id: que
        env:
          IDS: ${{ inputs.ids }}
        run: |
          # Solo se ejecuta a mano: sin ids se renderiza todo; con ids, solo esos.
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "ids: '$IDS'"
      - uses: actions/setup-node@v4
        if: steps.que.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.que.outputs.skip != 'true'
        run: npm ci
      - name: ffmpeg completo (ecualizador y compresor de la voz de anuncio; el de Remotion no los trae)
        if: steps.que.outputs.skip != 'true'
        # Sin esperas infinitas: apt a veces se queda colgado (espejo lento o bloqueo del sistema) y el job entero esperaba hasta el límite.
        # Cada intento tiene su tiempo máximo, apt no pregunta nada y, si no hay manera, falla en minutos en vez de quedarse pillado.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          for i in 1 2 3; do
            if timeout 90 sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Dpkg::Lock::Timeout=30 update -qq \
              && timeout 150 sudo -E apt-get -o Acquire::http::Timeout=15 -o Dpkg::Lock::Timeout=30 install -y -qq --no-install-recommends ffmpeg; then
              ffmpeg -version | head -1; exit 0
            fi
            echo "ffmpeg: el intento $i no terminó; reintento"; sleep 5
          done
          echo "No se pudo instalar ffmpeg tras 3 intentos"; exit 1
      - if: steps.que.outputs.skip != 'true'
        run: npx remotion browser ensure
      - name: Fondos automáticos (Pexels con etalonaje Zyra; solo si existe el secreto PEXELS_API_KEY)
        if: steps.que.outputs.skip != 'true'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fondos-auto.mjs 6
      - name: Renderizar (los ids indicados; todos si se deja vacío)
        if: steps.que.outputs.skip != 'true'
        run: node render.mjs ${{ steps.que.outputs.ids }}
      - name: 'Voz en off (Azure Speech o ElevenLabs) y música para los que piden voz'
        if: steps.que.outputs.skip != 'true'
        env:
          VOZ_PROVEEDOR: ${{ secrets.VOZ_PROVEEDOR || vars.VOZ_PROVEEDOR }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_VOICE: ${{ secrets.AZURE_SPEECH_VOICE || vars.AZURE_SPEECH_VOICE }}
          AZURE_SPEECH_RATE: ${{ secrets.AZURE_SPEECH_RATE || vars.AZURE_SPEECH_RATE }}
          AZURE_SPEECH_PITCH: ${{ secrets.AZURE_SPEECH_PITCH || vars.AZURE_SPEECH_PITCH }}
          AZURE_SPEECH_STYLE: ${{ secrets.AZURE_SPEECH_STYLE || vars.AZURE_SPEECH_STYLE }}
          AZURE_SPEECH_STYLE_DEGREE: ${{ secrets.AZURE_SPEECH_STYLE_DEGREE || vars.AZURE_SPEECH_STYLE_DEGREE }}
          AZURE_SPEECH_PERFIL: ${{ vars.AZURE_SPEECH_PERFIL }}
          VOZ_MEZCLA: ${{ vars.VOZ_MEZCLA }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY }}
          ELEVENLABS_SIMILARITY: ${{ vars.ELEVENLABS_SIMILARITY }}
          ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE }}
          ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED }}
        run: node scripts/voz-lote.mjs --limpiar
      - uses: actions/upload-artifact@v4
        if: steps.que.outputs.skip != 'true'
        with:
          name: videos-tiktok
          path: |
            out/*.mp4
            out/*.png
            out/*.voz.txt
            out/*.final.mp4
