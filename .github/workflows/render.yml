name: Generar vídeos
on:
  push:
    paths: ['guiones/**', 'memes/**', 'reacciones/**', 'src/**', 'public/**']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Qué hay que renderizar
        id: que
        run: |
          # Manual: todo. Por push: solo los guiones/memes/reacciones añadidos o modificados; todo si cambia la plantilla (src, public...).
          # Si el push solo borra vídeos, no se renderiza nada (skip=true).
          changed=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null || true)
          skip=false; ids=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ids=""
          elif [ -z "$changed" ]; then skip=true
          elif echo "$changed" | grep -qvE '^(guiones|memes|reacciones)/'; then ids=""
          else ids=$(echo "$changed" | sed -E 's#guiones/(.*)\.json#\1#; s#memes/(.*)\.json#meme-\1#; s#reacciones/(.*)\.json#reaccion-\1#' | tr '\n' ' '); fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "skip: $skip · ids: '$ids'"
      - uses: actions/setup-node@v4
        if: steps.que.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.que.outputs.skip != 'true'
        run: npm ci
      - if: steps.que.outputs.skip != 'true'
        run: npx remotion browser ensure
      - name: Renderizar (solo los guiones nuevos o cambiados; todos si cambia la plantilla)
        if: steps.que.outputs.skip != 'true'
        run: node render.mjs ${{ steps.que.outputs.ids }}
      - name: 'Voz en off (Azure Speech o ElevenLabs) y música para los que piden voz'
        if: steps.que.outputs.skip != 'true'
        env:
          VOZ_PROVEEDOR: ${{ secrets.VOZ_PROVEEDOR || vars.VOZ_PROVEEDOR }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_VOICE: ${{ secrets.AZURE_SPEECH_VOICE || vars.AZURE_SPEECH_VOICE }}
          AZURE_SPEECH_RATE: ${{ secrets.AZURE_SPEECH_RATE || vars.AZURE_SPEECH_RATE }}
          AZURE_SPEECH_PITCH: ${{ secrets.AZURE_SPEECH_PITCH || vars.AZURE_SPEECH_PITCH }}
          AZURE_SPEECH_STYLE: ${{ secrets.AZURE_SPEECH_STYLE || vars.AZURE_SPEECH_STYLE }}
          AZURE_SPEECH_STYLE_DEGREE: ${{ secrets.AZURE_SPEECH_STYLE_DEGREE || vars.AZURE_SPEECH_STYLE_DEGREE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY }}
          ELEVENLABS_SIMILARITY: ${{ vars.ELEVENLABS_SIMILARITY }}
          ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE }}
          ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED }}
        run: node scripts/voz-lote.mjs --limpiar
      - uses: actions/upload-artifact@v4
        if: steps.que.outputs.skip != 'true'
        with:
          name: videos-tiktok
          path: |
            out/*.mp4
            out/*.png
            out/*.voz.txt
            out/*.final.mp4
